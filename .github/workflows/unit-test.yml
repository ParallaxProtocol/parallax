name: Unit Test

on:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+.x'

  pull_request:
    branches:
      - main
      - '[0-9]+.[0-9]+.x'

jobs:
  unit-test:
    strategy:
      matrix:
        go-version: [1.26.x]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          # In order:
          # * Module download cache
          # * Build cache (Linux)
          # * Build cache (Mac)
          # * Build cache (Windows)
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            %LocalAppData%\go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # The fast lane: -short skips the stress suites (they run once, under
      # the race detector below) and -coverage records the profile, so no
      # separate coverage job re-runs the whole suite.
      - name: Unit Test
        env:
          ANDROID_HOME: "" # Skip android test
        run: |
          go clean -testcache
          go run build/ci.go test -short -coverage

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  race-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.x

      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-race-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-race-

      # Full suite including the stress tests; this is the one job that runs
      # them. p2p/simulations is excluded: its timing-heavy event stream tests
      # are known to flake under the race detector.
      - name: Race Test
        run: go test -race -p 1 $(go list ./... | grep -v p2p/simulations)

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.x

      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # The fixture tree is ~2GB; cache it keyed on the pinned submodule
      # commit (update the key when repinning tests/testdata).
      - name: Cache conformance fixtures
        id: fixtures-cache
        uses: actions/cache@v4
        with:
          path: tests/testdata
          key: ethereum-tests-a380655e5ffab1a5ea0f4d860224bdb19013f06a

      - name: Fetch conformance fixtures
        if: steps.fixtures-cache.outputs.cache-hit != 'true'
        run: git submodule update --init --depth 1 tests/testdata

      - name: Conformance Test
        run: go test ./tests/ -count=1 -timeout 30m
