name: Release

# Builds CLI binaries (parallaxd, parallax-cli, parallax-wallet, parallax)
# for every supported OS / arch and attaches them to a draft GitHub Release.
#
# CLI bundles use the same `make package` path as the local release,
# so the resulting parallax-<os>-<arch>.{tar.gz,zip} files are byte
# identical to what `make release` would produce locally. They are
# CGO-disabled, so a single Linux runner cross-compiles all targets.
#
# The desktop GUI (Parallax Desktop) is built and released from its own
# repository: https://github.com/ParallaxProtocol/parallax-wallet
#
# The release is published as a DRAFT so a maintainer can review the
# uploaded artifacts and notes before clicking "Publish release". Re-runs
# against `main` via workflow_dispatch only build artifacts; the release
# job is gated on a tag push.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# GitHub is deprecating Node.js 20 for JS-based actions; the official
# replacements (actions/checkout v5, setup-go v6, etc.) haven't shipped
# yet, so opt into the Node 24 runtime via the documented env var until
# they do. Drop this once every action used here advertises Node 24
# support natively.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ------------------------------------------------------------------ #
  # CLI: parallaxd / parallax-cli / parallax-wallet / parallax         #
  # One runner per target so each platform produces its own artifact   #
  # instead of being lumped together. The CLI is CGO-disabled so every #
  # target cross-compiles cleanly from a single ubuntu host.           #
  # ------------------------------------------------------------------ #
  build-cli:
    name: CLI ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux/amd64
            os: linux
            arch: amd64
            ext: tar.gz
          - target: linux/arm64
            os: linux
            arch: arm64
            ext: tar.gz
          - target: linux/armv7
            os: linux
            arch: armv7
            ext: tar.gz
          - target: linux/386
            os: linux
            arch: "386"
            ext: tar.gz
          - target: darwin/amd64
            os: darwin
            arch: amd64
            ext: tar.gz
          - target: darwin/arm64
            os: darwin
            arch: arm64
            ext: tar.gz
          - target: windows/amd64
            os: windows
            arch: amd64
            ext: zip
          - target: windows/386
            os: windows
            arch: "386"
            ext: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Install packaging deps
        run: |
          for i in 1 2 3 4; do
            sudo apt-get update -o Acquire::Retries=3 && break
            echo "::warning::apt-get update attempt $i failed, retrying"
            sudo rm -rf /var/lib/apt/lists/partial/*
            sleep $((i * 15))
          done
          sudo apt-get install -y --no-install-recommends zip

      - name: Cross-compile and package CLI
        env:
          # Same default set as `release: export CMDS := $(CMDS_RELEASE)`
          # in the Makefile. Keep these two in sync.
          CMDS: "parallaxd parallax-cli parallax-wallet parallax"
        run: |
          make package TARGETS="${{ matrix.target }}"
          ls -lh build/package/

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          # The artifact name matches the file inside it (sans extension)
          # so the workflow UI label, the file inside, and the eventual
          # release asset name all line up — `parallax-linux-amd64.tar.gz`
          # for unix targets and `parallax-windows-amd64.zip` for windows.
          name: parallax-${{ matrix.os }}-${{ matrix.arch }}
          path: build/package/parallax-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------ #
  # Release: collect everything, regenerate checksums, draft release   #
  # ------------------------------------------------------------------ #
  release:
    name: Publish draft release
    needs: [build-cli]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout (for release notes generation)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release directory
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) \
            -exec cp {} release/ \;
          cd release
          ls -lh
          # One canonical SHA256SUMS over all CLI bundles.
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/parallax-*.tar.gz
            release/parallax-*.zip
            release/SHA256SUMS.txt
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
